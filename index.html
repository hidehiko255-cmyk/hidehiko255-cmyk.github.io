  <h1>SLOT Drive Automation</h1>
  <p>SLOT分析の運用者が、GitHub Actionsで生成した予測と実績照合のファイルを、Google Driveの指定フォルダに保存するためのアプリです。一般利用者向けの登録や操作画面はありません。</p>
  <p>Googleの認証では、運用者が指定するファイルやフォルダの利用に使う <code>drive.file</code> 権限を求めます。アプリは指定フォルダを確認し、出力ファイルを作成して、その内容を読み戻します。</p>
